<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Link the bot</title>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0C14; color: #F6F2E9; font: 500 16px/1.5 system-ui, sans-serif; text-align: center; }
main { max-width: 440px; padding: 24px; }
h1 { font-size: 24px; margin: 0 0 8px; }
p { color: #A9A6B8; margin: 0 0 18px; }
#qr { width: 300px; height: 300px; margin: 0 auto 18px; background: #fff; border-radius: 12px; display: grid; place-items: center; color: #333; }
#qr svg { width: 280px; height: 280px; }
#state { font-weight: 700; color: #F7D13D; }
ol { text-align: left; color: #A9A6B8; padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>Link the test bot</h1>
  <p>Status: <span id="state">waiting for the bot…</span></p>
  <div id="qr">…</div>
  <ol>
    <li>On the bot's phone, open WhatsApp → Settings → Linked devices → Link a device.</li>
    <li>Scan this code. It refreshes every 20 seconds or so, so scan the newest one.</li>
    <li>When the status says online, post a poll in the test group.</li>
  </ol>
  <p id="extra"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// Reads the bot's status from the local test database (never the live one).
const URL_ = "http://127.0.0.1:9000/waBot/status.json?ns=jlic-ucla-tv";
let last = "";
async function check() {
  try {
    const s = await fetch(URL_, { headers: { Authorization: "Bearer owner" } }).then((r) => r.json());
    document.getElementById("state").textContent = s?.state || "waiting for the bot…";
    const box = document.getElementById("qr");
    if (s?.qr && s.qr !== last) {
      last = s.qr;
      const q = qrcode(0, "L"); q.addData(s.qr); q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 6, margin: 2 });
    } else if (!s?.qr) {
      box.textContent = s?.state === "online" ? "Linked" : "…";
    }
    const bits = [s?.groups && `Groups: ${s.groups.join(", ")}`, s?.lastPoll && `Last poll: ${s.lastPoll}`, s?.lastVote && `Last vote: ${s.lastVote}`].filter(Boolean);
    document.getElementById("extra").textContent = bits.join(" · ");
  } catch {
    document.getElementById("state").textContent = "can't reach the local database";
  }
}
check();
setInterval(check, 2000);
</script>
</body>
</html>
